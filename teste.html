<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Base baseada na imagem brave_screenshot_localhost.png */
        :root {
            --bg-green: #f0f7f4;
            --dark-green: #1d3324;
            --accent-green: #4caf50;
        }

        body {
            background-color: var(--bg-green);
            font-family: sans-serif;
        }

        /* Desktop */
        .table-header {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1fr 1fr;
            background: var(--dark-green);
            color: white;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .table-row {
            display: grid;
            grid-template-columns: 1fr 2fr 1fr 1fr 1fr;
            background: white;
            margin-top: 10px;
            padding: 15px;
            border-radius: 8px;
            align-items: center;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        /* --- RESPONSIVIDADE (Mobile) --- */
        @media (max-width: 768px) {
            .table-header {
                display: none;
            }

            /* Esconde o cabeçalho original */

            .table-row {
                display: flex;
                flex-direction: column;
                /* Transforma linha em card */
                text-align: left;
                position: relative;
                padding-left: 100px;
                /* Espaço para a imagem fixa */
                min-height: 100px;
            }

            .col-img {
                position: absolute;
                left: 15px;
                top: 15px;
            }

            .table-row div {
                margin-bottom: 8px;
            }

            /* Adiciona labels antes do conteúdo para contexto */
            .col-nome::before,
            .col-status::before,
            .col-data::before {
                content: attr(data-label) ": ";
                font-weight: bold;
                color: var(--dark-green);
                display: inline-block;
                width: 90px;
            }

            .col-opcoes {
                position: absolute;
                right: 15px;
                top: 15px;
            }
        }

        .placeholder-img {
            width: 60px;
            height: 60px;
            background: #ccc;
            border-radius: 4px;
        }
    </style>
    <title>Document</title>
</head>

<body>
    <div class="container">
        <div class="header-row">
            <h1>Registrar Objeto</h1>
            <button class="btn-add">+ Registrar objeto</button>
        </div>

        <div class="table-container">
            <!-- Cabeçalho (Oculto no mobile) -->
            <div class="table-header">
                <span>Imagem</span>
                <span>Nome</span>
                <span>Status</span>
                <span>Registrado</span>
                <span>Opções</span>
            </div>

            <!-- Linha / Card -->
            <div class="table-row">
                <div class="col-img">
                    <div class="placeholder-img"></div>
                </div>
                <div class="col-nome" data-label="Nome">Nome do objeto</div>
                <div class="col-status" data-label="Status">Pendente</div>
                <div class="col-data" data-label="Registrado">24 out, 2025</div>
                <div class="col-opcoes"><button class="btn-opt">+</button></div>
            </div>

            <!-- Repetir .table-row para outros itens -->
        </div>
    </div>
</body>

</html>
